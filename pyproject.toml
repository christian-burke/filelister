[project]
name = "filelister"
version = "0.0.2"
description = "Filelister is a Python package that makes working with filelists (yes, lists of files) easy."
authors = [{ name = "NaN Developers", email = "nanwtf@proton.me" }]
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
dependencies = [
    "termcolor>=1.1.0,<2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.8",
    "tqdm>=4.64",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"
